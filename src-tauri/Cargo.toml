[package]
name = "linh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
base64 = "0.22"
libc = "0.2"
linh-core = { path = "../crates/linh-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-deep-link = "2.6"
url = "2"
webkit2gtk = "2"

[[bin]]
name = "linh"
path = "src/main.rs"
