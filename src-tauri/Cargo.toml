[package]
name = "linh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
default = ["self-update"]
# Linh's in-app updater (`tauri-plugin-updater`). Off entirely for the
# `msstore`/`mas` `LINH_DIST` channels — Microsoft Store policy and Apple's
# App Store guideline 2.5.2 forbid a self-updating code path, and `build.rs`
# fails the build if this is left on for either. See docs/release.md.
self-update = ["dep:tauri-plugin-updater"]

[dependencies]
base64 = "0.22"
linh-core = { path = "../crates/linh-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-deep-link = "2.6"
tauri-plugin-notification = "2.8"
tauri-plugin-updater = { version = "2.14", optional = true }
tokio = { version = "1", default-features = false, features = ["time"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
webkit2gtk = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Packaging_Appx", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
plist = "1"
# Only used by `platform::macos::workspace` (the `LINH_DIST=mas` launch
# path): `NSWorkspace`'s sandboxed-safe open/default-handler APIs, which
# a Mac App Store build must use instead of exec'ing `/usr/bin/open` or
# calling the (sandbox-hostile) `LaunchServices` C functions that write
# state (`LSSetDefaultHandlerForURLScheme`) — see that module's doc
# comment. `objc2`/`objc2-app-kit`/`block2` were already in this
# workspace's `Cargo.lock` before this change, pulled in transitively by
# `tauri` itself on macOS (at smaller feature sets than this enables),
# so this adds direct edges to an existing dependency, not a brand new
# one to the tree. Both generated crates default to building every
# AppKit/Foundation class they know of; `default-features = false` plus
# an explicit list keeps this to just `NSWorkspace` (which itself also
# defines `NSWorkspaceOpenConfiguration`, used for the argument-less
# open) and the completion-handler plumbing (`NSRunningApplication`,
# `block2`) `workspace.rs` actually calls.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSString", "NSURL", "NSArray", "NSError",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSWorkspace", "NSRunningApplication", "block2",
] }
block2 = "0.6"

[[bin]]
name = "linh"
path = "src/main.rs"

[dev-dependencies]
minisign = "0.10.0"
tiny_http = "0.12.0"
tauri = { version = "2.12", features = ["test"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
