name: Cross-platform

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build UI
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (MAS flavour)
        if: matrix.os == 'macos-15'
        env:
          LINH_DIST: mas
        run: cargo clippy -p linh --no-default-features --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Install tauri-cli
        if: matrix.os == 'windows-latest' || matrix.os == 'macos-15'
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build unsigned NSIS installer
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis

      - name: Upload unsigned NSIS installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linh-windows-unsigned-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Build unsigned dmg
        if: matrix.os == 'macos-15'
        working-directory: src-tauri
        run: cargo tauri build --bundles app,dmg

      - name: Upload unsigned dmg
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: linh-macos-unsigned-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
