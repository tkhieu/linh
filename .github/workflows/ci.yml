name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            webkit2gtk4.1-devel \
            gtk3-devel \
            libappindicator-gtk3-devel \
            librsvg2-devel \
            libxdo-devel \
            openssl-devel \
            gcc \
            gcc-c++ \
            make \
            pkgconf-pkg-config \
            rpm-build \
            cpio \
            file \
            git \
            curl \
            nodejs \
            npm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal -c rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install pnpm
        run: npm install -g pnpm@12.11.2

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-fedora44-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-fedora44-

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo check (store flavour, LINH_DIST=msstore)
        # Proves the msstore/mas build configuration (self-update feature
        # off, tauri-plugin-updater compiled out entirely) keeps compiling
        # on every push, even though no workflow here builds and submits
        # the actual Store packages yet. See docs/release.md.
        env:
          LINH_DIST: msstore
        run: cargo check -p linh --no-default-features --all-targets

      - name: cargo clippy (store flavour, LINH_DIST=msstore)
        env:
          LINH_DIST: msstore
        run: cargo clippy -p linh --no-default-features --all-targets -- -D warnings

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install

      - name: pnpm lint
        working-directory: ui
        run: pnpm lint

      - name: pnpm typecheck
        working-directory: ui
        run: pnpm typecheck

      - name: pnpm test
        working-directory: ui
        run: pnpm test

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build RPM bundle
        working-directory: src-tauri
        run: |
          # The cargo cache above is keyed only on Cargo.lock, so a cache
          # hit can restore a bundle directory left over from a previous
          # run (e.g. built under an older productName). The bundler
          # doesn't clean sibling files with a different name, so a stale
          # .rpm here can make the next step pick the wrong file.
          rm -rf ../target/release/bundle
          cargo tauri build --bundles rpm

      - name: Verify .desktop file in RPM
        shell: bash
        env:
          BUNDLE_FORMAT: rpm
        run: &verify_desktop |
          set -euo pipefail
          if [ "$BUNDLE_FORMAT" = deb ]; then
            deb="$(find target/release/bundle/deb -name '*.deb' | head -n1)"
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
            desktop="$(dpkg-deb --fsys-tarfile "$deb" | tar -xO usr/share/applications/linh.desktop)"
            # Check that Ubuntu can resolve the package's runtime dependencies.
            sudo apt-get --simulate install "$PWD/$deb"
          else
            rpm="$(find target/release/bundle/rpm -name '*.rpm' | head -n1)"
            desktop="$(rpm2cpio "$rpm" | cpio -i --to-stdout ./usr/share/applications/linh.desktop 2>/dev/null)"
          fi
          echo "$desktop"

          fail() { echo "::error::$1"; exit 1; }

          exec_line="$(grep '^Exec=' <<< "$desktop")"
          [ "$exec_line" = "Exec=linh %u" ] || fail "expected exact line 'Exec=linh %u', got '$exec_line'"

          name_line="$(grep '^Name=' <<< "$desktop")"
          [ "$name_line" = "Name=Linh" ] || fail "expected exact line 'Name=Linh', got '$name_line'"

          categories_line="$(grep '^Categories=' <<< "$desktop")"
          IFS=';' read -ra categories <<< "${categories_line#Categories=}"
          printf '%s\n' "${categories[@]}" | grep -qxF 'WebBrowser' \
            || fail "Categories does not contain exact element 'WebBrowser': $categories_line"

          mimetype_line="$(grep '^MimeType=' <<< "$desktop")"
          IFS=';' read -ra mimetypes <<< "${mimetype_line#MimeType=}"
          for needle in 'x-scheme-handler/http' 'x-scheme-handler/https' 'text/html'; do
            printf '%s\n' "${mimetypes[@]}" | grep -qxF "$needle" \
              || fail "MimeType does not contain exact element '$needle': $mimetype_line"
          done

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: linh-rpm
          path: target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  deb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            file

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install pnpm
        run: npm install -g pnpm@12.11.2

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-ubuntu24.04-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-ubuntu24.04-

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build DEB bundle
        working-directory: src-tauri
        run: |
          rm -rf ../target/release/bundle/deb
          cargo tauri build --bundles deb

      - name: Verify .desktop file and dependencies in DEB
        shell: bash
        env:
          BUNDLE_FORMAT: deb
        run: *verify_desktop

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: linh-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
