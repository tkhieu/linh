name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts without creating a GitHub Release
        type: boolean
        default: true
      skip_signing:
        description: >-
          Force an unsigned build to prove the no-secrets path, even though
          signing secrets are configured. Only honored together with
          dry_run=true; ignored otherwise.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Check release versions
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/check-release-version.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check-release-version.py
          fi
          version="$(python3 scripts/check-release-version.py | sed -n 's/^VERSION=//p')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  signing:
    runs-on: ubuntu-24.04
    outputs:
      sign: ${{ steps.policy.outputs.sign }}
    steps:
      - name: Resolve updater signing policy
        id: policy
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" && "${{ inputs.skip_signing }}" == "true" ]]; then
            echo "::notice::skip_signing=true on a dry run; forcing an unsigned build to prove the no-secrets path."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "$TAURI_SIGNING_PRIVATE_KEY" && -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY/_PASSWORD are not set; this dry run will skip signing updater artifacts."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD are required to sign updater artifacts for a release." >&2
            exit 1
          fi

  build:
    needs: [version, signing]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: fedora
            os: ubuntu-latest
            container: fedora:44
            artifact: linh-fedora-rpm
            files: |
              target/release/bundle/rpm/*.rpm
              target/release/bundle/rpm/*.rpm.sig
          - platform: ubuntu
            os: ubuntu-24.04
            container: ''
            artifact: linh-ubuntu-deb
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/deb/*.deb.sig
          - platform: windows
            os: windows-latest
            container: ''
            artifact: linh-windows
            files: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
              target/release/msix/*.msix
          - platform: macos
            os: macos-15
            container: ''
            artifact: linh-macos-universal-dmg
            files: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install Fedora system dependencies
        if: matrix.platform == 'fedora'
        run: |
          dnf install -y \
            webkit2gtk4.1-devel gtk3-devel libappindicator-gtk3-devel \
            librsvg2-devel libxdo-devel openssl-devel gcc gcc-c++ make \
            pkgconf-pkg-config rpm-build cpio file git curl nodejs npm

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Ubuntu system dependencies
        if: matrix.platform == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file

      - name: Install Rust on Linux
        if: matrix.platform == 'fedora' || matrix.platform == 'ubuntu'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust on macOS and Windows
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install pnpm on Linux
        if: matrix.platform == 'fedora' || matrix.platform == 'ubuntu'
        run: npm install -g pnpm@12.11.2

      - name: Install pnpm on macOS and Windows
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: 12.11.2

      - name: Install Node.js on macOS and Windows
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-cargo-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-cargo-${{ matrix.platform }}-

      - name: Remove stale bundle outputs from a previous cached run
        shell: bash
        run: |
          set -euo pipefail
          # The cache above restores the whole `target` tree, including any
          # installer, `.sig`, or macOS `.app.tar.gz` a previous (possibly
          # signed, possibly older-version) run left behind. Wipe every
          # output directory this job's build and upload steps touch before
          # building, so a stale signature or a stale older-version bundle
          # can never ride along with a fresh, unsigned, or differently
          # versioned build.
          # target/msstore is wiped too: its binary and the build stamp
          # next to it (see build.rs's write_dist_stamp) must always come
          # from the SAME build. A stale cached exe sitting next to a
          # stale cached stamp from an earlier run would otherwise still
          # read as "a confirmed msstore build" to package-msix.ps1's
          # content check, even though neither was produced by the build
          # this job is about to run.
          rm -rf \
            target/release/bundle/rpm \
            target/release/bundle/deb \
            target/release/bundle/nsis \
            target/release/msix \
            target/msstore \
            target/universal-apple-darwin/release/bundle/dmg \
            target/universal-apple-darwin/release/bundle/macos

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build Fedora RPM
        if: matrix.platform == 'fedora'
        working-directory: src-tauri
        run: |
          rm -rf ../target/release/bundle
          cargo tauri build --bundles rpm

      - name: Sign updater RPM
        if: matrix.platform == 'fedora' && needs.signing.outputs.sign == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri signer sign --app-version "${{ needs.version.outputs.version }}" target/release/bundle/rpm/*.rpm

      - name: Build Ubuntu DEB
        if: matrix.platform == 'ubuntu'
        working-directory: src-tauri
        run: |
          rm -rf ../target/release/bundle/deb
          cargo tauri build --bundles deb

      - name: Sign updater DEB
        if: matrix.platform == 'ubuntu' && needs.signing.outputs.sign == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri signer sign --app-version "${{ needs.version.outputs.version }}" target/release/bundle/deb/*.deb

      - name: Build unsigned Windows NSIS installer
        if: matrix.platform == 'windows'
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis

      - name: Verify the NSIS build still has the self-updater (positive control)
        if: matrix.platform == 'windows'
        shell: pwsh
        # Proves the marker check itself still works, rather than only
        # ever exercising its "absent" branch: if tauri-plugin-updater
        # ever renames/removes the string this looks for, this step
        # fails loudly here instead of the Store packaging step's
        # "absent" check silently passing for the wrong reason.
        run: ./scripts/assert-self-updater-presence.ps1 -ExePath target/release/linh.exe -Expect present

      - name: Build Windows Store binary (LINH_DIST=msstore)
        if: matrix.platform == 'windows'
        working-directory: src-tauri
        # A separate binary, into its own `--target-dir`, so it never
        # clobbers the NSIS installer's own `target/release/linh.exe`
        # above (which is deliberately the default `github` flavour,
        # self-updater included). `--no-default-features` turns off the
        # `self-update` feature here; the leading `--` is required by
        # `cargo tauri build` to pass cargo-level flags through to the
        # underlying `cargo` invocation (`cargo tauri build --help`).
        env:
          LINH_DIST: msstore
        run: cargo tauri build --no-bundle -- --no-default-features --target-dir ../target/msstore

      - name: Package unsigned Windows Store MSIX
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          LINH_VERSION: ${{ needs.version.outputs.version }}
          LINH_STORE_EXE_PATH: target/msstore/release/linh.exe
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/package-msix.ps1

      - name: Build macOS universal DMG and app bundle
        if: matrix.platform == 'macos'
        shell: bash
        working-directory: src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" && \
                -n "$APPLE_SIGNING_IDENTITY" && -n "$APPLE_ID" && \
                -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo 'All Apple secrets present: Developer ID signing and notarization enabled.'
          else
            echo 'NOTICE: Apple secrets incomplete; building without Developer ID signing or notarization.'
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          cargo tauri build --bundles dmg,app --target universal-apple-darwin

      - name: Package macOS updater archive
        if: matrix.platform == 'macos'
        working-directory: target/universal-apple-darwin/release/bundle/macos
        run: |
          set -euo pipefail
          app="$(ls -d -- *.app)"
          tar -czf "${app}.tar.gz" "$app"

      - name: Sign updater macOS app archive
        if: matrix.platform == 'macos' && needs.signing.outputs.sign == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          cargo tauri signer sign --app-version "${{ needs.version.outputs.version }}"
          target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

      - name: Verify Windows outputs exist
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-ChildItem target/release/bundle/nsis/*.exe)) { throw 'NSIS installer missing' }
          if (-not (Get-ChildItem target/release/msix/*.msix)) { throw 'MSIX package missing' }

      - name: Sign updater NSIS installer
        if: matrix.platform == 'windows' && needs.signing.outputs.sign == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri signer sign --app-version "${{ needs.version.outputs.version }}" target/release/bundle/nsis/*.exe

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  mas:
    needs: [version]
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: 12.11.2

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '=2.12.4' --locked

      - name: Build unsigned Mac App Store app
        working-directory: src-tauri
        env:
          LINH_DIST: mas
        run: cargo tauri build --bundles app --config tauri.mas.conf.json -- --no-default-features --target-dir ../target/mas

      - name: Verify MAS binary, metadata and entitlements
        shell: bash
        run: |
          set -euo pipefail
          app="target/mas/release/bundle/macos/linh.app"
          test -d "$app"
          binary="$app/Contents/MacOS/linh"
          test -f "$binary"
          if LC_ALL=C grep -aFq 'Updater does not have any endpoints set.' "$binary"; then
            echo '::error::MAS binary contains the self-updater marker.'
            exit 1
          fi
          echo 'MAS self-updater marker absent'
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Contents/Info.plist" | grep -qx 'false'
          /usr/libexec/PlistBuddy -c 'Print :LSApplicationCategoryType' "$app/Contents/Info.plist" | grep -qx 'public.app-category.utilities'
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist" | grep -qx '13.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'dev.hieutk.linh'
          proof="$RUNNER_TEMP/linh-mas-entitlements-proof.app"
          ditto "$app" "$proof"
          codesign --force --deep --sign - --entitlements src-tauri/macos/Linh.mas.entitlements "$proof"
          codesign -d --entitlements :- "$proof"
          codesign -d --entitlements :- "$proof" 2>/dev/null | plutil -extract com.apple.security.app-sandbox raw -o - - | grep -qx 'true'
          echo 'MAS sandbox entitlement applied to ad-hoc-signed copy'

      - name: Archive unsigned MAS app
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent target/mas/release/bundle/macos/linh.app Linh-mas-unsigned.app.zip
          echo 'Unsigned MAS .app built and archived'

      - name: Upload unsigned MAS app workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mas-app-unsigned
          path: Linh-mas-unsigned.app.zip
          if-no-files-found: error

      - name: Check MAS signing secrets
        id: mas_signing
        shell: bash
        env:
          MAS_APP_CERT: ${{ secrets.APPLE_MAS_CERTIFICATE }}
          MAS_APP_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATE_PASSWORD }}
          MAS_INSTALLER_CERT: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE }}
          MAS_PROFILE: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE }}
        run: |
          if [[ -n "$MAS_APP_CERT" && -n "$MAS_APP_PASSWORD" && -n "$MAS_INSTALLER_CERT" && -n "$MAS_PROFILE" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'MAS signing secrets present'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'MAS signing skipped: one or more MAS secrets are absent'
          fi

      - name: Sign MAS app and installer
        if: steps.mas_signing.outputs.enabled == 'true'
        shell: bash
        env:
          MAS_APP_CERT: ${{ secrets.APPLE_MAS_CERTIFICATE }}
          MAS_APP_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATE_PASSWORD }}
          MAS_INSTALLER_CERT: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE }}
          MAS_PROFILE: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/linh-mas.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true' EXIT
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          printf '%s' "$MAS_APP_CERT" | base64 -D > "$RUNNER_TEMP/mas-app.p12"
          printf '%s' "$MAS_INSTALLER_CERT" | base64 -D > "$RUNNER_TEMP/mas-installer.p12"
          printf '%s' "$MAS_PROFILE" | base64 -D > "$RUNNER_TEMP/mas.provisionprofile"
          security import "$RUNNER_TEMP/mas-app.p12" -k "$keychain" -P "$MAS_APP_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/mas-installer.p12" -k "$keychain" -P "$MAS_APP_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security cms -D -i "$RUNNER_TEMP/mas.provisionprofile" > "$RUNNER_TEMP/mas-profile.plist"
          python3 - <<'PYCODE'
          import plistlib
          from pathlib import Path
          profile = plistlib.loads(Path(__import__('os').environ['RUNNER_TEMP'], 'mas-profile.plist').read_bytes())
          team = profile['TeamIdentifier'][0]
          entitlement_path = Path(__import__('os').environ['RUNNER_TEMP'], 'mas-signing.entitlements')
          entitlements = plistlib.loads(Path('src-tauri/macos/Linh.mas.entitlements').read_bytes())
          entitlements['com.apple.application-identifier'] = f'{team}.dev.hieutk.linh'
          entitlements['com.apple.developer.team-identifier'] = team
          entitlement_path.write_bytes(plistlib.dumps(entitlements))
          PYCODE
          app='target/mas/release/bundle/macos/linh.app'
          cp "$RUNNER_TEMP/mas.provisionprofile" "$app/Contents/embedded.provisionprofile"
          app_identity="$(security find-identity -v -p codesigning "$keychain" | sed -nE 's/.*"((3rd Party Mac Developer Application|Apple Distribution):[^"]+)".*/\1/p' | head -1)"
          test -n "$app_identity"
          codesign --force --deep --sign "$app_identity" --keychain "$keychain" --entitlements "$RUNNER_TEMP/mas-signing.entitlements" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          installer_identity="$(security find-identity -v "$keychain" | sed -nE 's/.*"((3rd Party Mac Developer Installer|Mac Installer Distribution):[^"]+)".*/\1/p' | head -1)"
          test -n "$installer_identity"
          productbuild --component "$app" /Applications --sign "$installer_identity" --keychain "$keychain" Linh-mas.pkg
          echo 'Signed MAS .pkg built for manual Transporter upload'

      - name: Upload signed MAS pkg workflow artifact
        if: steps.mas_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mas-pkg-signed
          path: Linh-mas.pkg
          if-no-files-found: error

  assets:
    needs: [version, signing, build, mas]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Download all installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: linh-*
          path: dist
          merge-multiple: true

      - name: Prepare release assets and SHA256SUMS
        run: >-
          python3 scripts/prepare-release-artifacts.py dist release-assets
          ${{ needs.signing.outputs.sign != 'true' && '--unsigned' || '' }}

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS

      - name: Upload complete release asset set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: linh-release-assets
          path: release-assets/*
          if-no-files-found: error

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    needs: [version, assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: linh-release-assets
          path: release-assets

      - name: Verify checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --generate-notes
