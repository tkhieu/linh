name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts without creating a GitHub Release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Check release versions
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/check-release-version.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check-release-version.py
          fi
          version="$(python3 scripts/check-release-version.py | sed -n 's/^VERSION=//p')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: fedora
            os: ubuntu-latest
            container: fedora:44
            artifact: linh-fedora-rpm
            files: target/release/bundle/rpm/*.rpm
          - platform: ubuntu
            os: ubuntu-24.04
            container: ''
            artifact: linh-ubuntu-deb
            files: target/release/bundle/deb/*.deb
          - platform: windows
            os: windows-latest
            container: ''
            artifact: linh-windows
            files: |
              target/release/bundle/nsis/*.exe
              target/release/msix/*.msix
          - platform: macos
            os: macos-15
            container: ''
            artifact: linh-macos-universal-dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install Fedora system dependencies
        if: matrix.platform == 'fedora'
        run: |
          dnf install -y \
            webkit2gtk4.1-devel gtk3-devel libappindicator-gtk3-devel \
            librsvg2-devel libxdo-devel openssl-devel gcc gcc-c++ make \
            pkgconf-pkg-config rpm-build cpio file git curl nodejs npm

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Ubuntu system dependencies
        if: matrix.platform == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file

      - name: Install Rust on Linux
        if: matrix.platform == 'fedora' || matrix.platform == 'ubuntu'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust on macOS and Windows
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install pnpm on Linux
        if: matrix.platform == 'fedora' || matrix.platform == 'ubuntu'
        run: npm install -g pnpm@12.11.2

      - name: Install pnpm on macOS and Windows
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: 12.11.2

      - name: Install Node.js on macOS and Windows
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-cargo-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-cargo-${{ matrix.platform }}-

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build Fedora RPM
        if: matrix.platform == 'fedora'
        working-directory: src-tauri
        run: |
          rm -rf ../target/release/bundle
          cargo tauri build --bundles rpm

      - name: Build Ubuntu DEB
        if: matrix.platform == 'ubuntu'
        working-directory: src-tauri
        run: |
          rm -rf ../target/release/bundle/deb
          cargo tauri build --bundles deb

      - name: Build unsigned Windows NSIS installer
        if: matrix.platform == 'windows'
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis

      - name: Package unsigned Windows Store MSIX
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          LINH_VERSION: ${{ needs.version.outputs.version }}
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/package-msix.ps1

      - name: Build macOS universal DMG
        if: matrix.platform == 'macos'
        shell: bash
        working-directory: src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" && \
                -n "$APPLE_SIGNING_IDENTITY" && -n "$APPLE_ID" && \
                -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo 'All Apple secrets present: Developer ID signing and notarization enabled.'
          else
            echo 'NOTICE: Apple secrets incomplete; building without Developer ID signing or notarization.'
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          cargo tauri build --bundles dmg --target universal-apple-darwin

      - name: Verify Windows outputs exist
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-ChildItem target/release/bundle/nsis/*.exe)) { throw 'NSIS installer missing' }
          if (-not (Get-ChildItem target/release/msix/*.msix)) { throw 'MSIX package missing' }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: linh-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.rpm ./*.deb ./*.exe ./*.msix ./*.dmg > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --generate-notes
